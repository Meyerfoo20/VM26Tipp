    <style>
        /* --- DESIGN SYSTEM --- */
        :root {
            --bg-main: #040814;
            --bg-card: rgba(15, 23, 42, 0.55);
            --bg-hover: rgba(30, 41, 59, 0.75);

        h1 { font-size: 1.8rem; font-weight: 950; letter-spacing: -1px; background: linear-gradient(135deg, #ffffff 40%, #cbd5e1 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .live-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.72rem; text-transform: uppercase; font-weight: 700; color: var(--accent-green); letter-spacing: 0.5px; }
        .live-dot { width: 7px; height: 7px; background-color: var(--accent-green); border-radius: 50%; box-shadow: 0 0 8px var(--accent-green); animation: pulse-dot 1.8s infinite; }
        .header-profile { display: flex; align-items: center; gap: 10px; background: rgba(30, 41, 59, 0.3); border: 1px solid var(--border); padding: 4px 12px 4px 4px; border-radius: 30px; cursor: pointer; transition: all 0.25s ease; backdrop-filter: blur(10px); }

        .header-profile-name { font-size: 0.8rem; font-weight: 800; color: #fff; }

        /* --- VECKANS UTMANING WIDGET --- */
        .challenge-box { background: linear-gradient(135deg, rgba(251, 191, 36, 0.15) 0%, rgba(16, 185, 129, 0.05) 100%); border: 1px solid var(--border-glow); border-radius: 14px; padding: 12px 16px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 20px rgba(251, 191, 36, 0.05); }
        .challenge-icon { font-size: 1.8rem; }
        .challenge-details h3 { font-size: 0.75rem; text-transform: uppercase; color: var(--amber); letter-spacing: 1px; font-weight: 800; }
        .challenge-details p { font-size: 0.92rem; color: #f1f5f9; font-weight: 600; margin-top: 1px; }

        .feed { display: flex; flex-direction: column; gap: 24px; }

        .post-card.challenge-entry { border: 1.5px solid var(--amber); box-shadow: 0 0 20px rgba(251, 191, 36, 0.1); }
        .challenge-badge { background: var(--amber); color: #040814; font-size: 0.68rem; font-weight: 800; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; letter-spacing: 0.5px; display: inline-block; margin-left: auto; }

        /* --- CAROUSELL --- */
        .users-carousel-container { margin-bottom: 20px; padding: 0 5px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .users-carousel { display: flex; gap: 18px; overflow-x: auto; padding-bottom: 12px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }

        .user-carousel-item { display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; min-width: 68px; }

        .post-header { padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; }
        .post-header-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .post-user-info { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.8rem; text-transform: uppercase; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); position: relative; }

        .post-img-container { width: 100%; background: #02050f; position: relative; display: flex; justify-content: center; align-items: center; }
        .post-img { width: 100%; max-height: 580px; object-fit: cover; display: block; }

        .post-actions-bar { padding: 12px 14px 4px 14px; display: flex; justify-content: space-between; align-items: center; }
        .actions-left { display: flex; gap: 12px; }
        .action-icon-btn { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; color: var(--text-muted); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: all 0.2s ease; }
        .action-icon-btn:hover { transform: scale(1.05); color: #fff; }
        .action-icon-btn.active { background: rgba(251, 191, 36, 0.12); border-color: var(--amber); color: var(--amber); }

        .post-footer { padding: 0 14px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
        .post-caption { font-size: 0.95rem; line-height: 1.45; color: #e2e8f0; margin-top: 4px; }
        .post-caption strong { color: #fff; margin-right: 6px; font-weight: 700; }
        .btn-save-insta { background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; padding: 6px; border-radius: 50%; transition: all 0.2s; }
        .btn-save-insta:hover { color: #fff; background: rgba(255,255,255,0.05); }

        /* --- PROFILBILD EDIT SYSTEM --- */
        .modal-avatar-wrapper { position: relative; display: inline-block; cursor: pointer; }
        .avatar-edit-overlay { position: absolute; bottom: 0; right: 0; background: var(--amber); width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; border: 2px solid var(--bg-main); box-shadow: 0 2px 6px rgba(0,0,0,0.4); transition: transform 0.2s; }

        .checkbox-container { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; color: #cbd5e1; cursor: pointer; font-weight: 600; background: rgba(251, 191, 36, 0.05); padding: 8px 12px; border-radius: 10px; border: 1px dashed rgba(251, 191, 36, 0.3); }
        .checkbox-container input { cursor: pointer; width: 16px; height: 16px; accent-color: var(--amber); }

        /* --- RESTEN AV DESIGNEN --- */
        .comments-list { display: flex; flex-direction: column; gap: 8px; max-height: 180px; overflow-y: auto; padding-right: 4px; }
        .comment-item { font-size: 0.88rem; line-height: 1.4; background: rgba(255,255,255,0.02); padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.03); }

        .comment-input-container { display: flex; gap: 8px; margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.04); padding-top: 10px; }
        .comment-input { flex: 1; background: transparent; border: none; color: #fff; font-size: 0.88rem; font-family: inherit; }
        .comment-input:focus { outline: none; border-color: var(--accent-green); }
        .btn-comment-submit { background: none; border: none; color: var(--accent-green); font-weight: 700; cursor: pointer; font-size: 0.88rem; opacity: 0.8; }
        .btn-comment-submit:hover { opacity: 1; }

        .upload-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 25px; backdrop-filter: blur(20px); }
        .upload-card h2 { font-size: 1.15rem; font-weight: 800; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        input[type="text"] { width: 100%; background: rgba(7, 11, 22, 0.75); border: 1px solid var(--border); padding: 12px 14px; border-radius: 10px; color: white; font-family: inherit; font-size: 0.92rem; }

        .file-label { display: flex; align-items: center; justify-content: center; gap: 10px; border: 2px dashed rgba(148, 163, 184, 0.25); padding: 20px; border-radius: 12px; cursor: pointer; color: var(--text-muted); font-weight: 600; font-size: 0.9rem; }

        .filter-selectors { display: flex; gap: 6px; margin: 12px 0; justify-content: space-between; overflow-x: auto; padding-bottom: 4px; }
        .filter-btn { flex: 1; min-width: 75px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: var(--text-muted); padding: 8px 4px; border-radius: 8px; font-size: 0.72rem; font-weight: 700; cursor: pointer; transition: all 0.2s; text-align: center; white-space: nowrap; }
        .filter-btn.active { border-color: var(--amber); color: var(--amber); background: rgba(251, 191, 36, 0.08); }
        .preview-canvas-container { width: 100%; max-width: 200px; aspect-ratio: 1/1; margin: 0 auto 15px auto; border-radius: 8px; overflow: hidden; display: none; border: 1px solid var(--border); }
        .preview-canvas-container canvas { width: 100%; height: 100%; object-fit: cover; }

        .btn { background: rgba(30, 41, 59, 0.4); color: white; border: 1px solid var(--border); padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 0.88rem; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: linear-gradient(135deg, #10b981 0%, #059669 100%); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 4px 15px var(--accent-glow); }

        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: calc(100% - 20px); max-width: 480px; background: rgba(13, 22, 47, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(24px); border-radius: 20px; padding: 10px; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); text-decoration: none; font-size: 0.7rem; font-weight: 700; width: 45%; }
        .nav-item svg { width: 22px; height: 22px; stroke: var(--text-muted); }
        .nav-item.active { color: var(--amber); }
        .nav-item.active svg { stroke: var(--amber); }

        .profile-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(4, 8, 20, 0.9); backdrop-filter: blur(20px); z-index: 2000; display: none; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 40px 10px; }
        .profile-modal-content { background: rgba(15, 23, 42, 0.95); border: 1px solid var(--border); max-width: 500px; width: 100%; border-radius: 20px; padding: 24px; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        .close-modal { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.05); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }

        .modal-avatar { width: 80px; height: 80px; border-radius: 50%; overflow: hidden; border: 2px solid var(--amber); display: flex; justify-content: center; align-items: center; box-shadow: 0 0 15px var(--amber-glow); }
        
        .profile-stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 320px; margin: 10px 0; }
        .stat-box { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); padding: 10px; border-radius: 12px; text-align: center; }
        .stat-value { font-size: 1.2rem; font-weight: 800; color: var(--amber); }
        .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
        
        .profile-bio-container { width: 100%; margin-top: 5px; font-size: 0.9rem; color: #cbd5e1; line-height: 1.4; }
        .bio-text { font-style: italic; color: #e2e8f0; background: rgba(0,0,0,0.2); padding: 8px 12px; border-radius: 8px; border-left: 3px solid var(--accent-green); display: inline-block; width: 100%; text-align: left; }

        .btn-edit-bio { background: none; border: none; color: var(--text-muted); font-size: 0.75rem; text-decoration: underline; cursor: pointer; margin-top: 4px; }

        .profile-gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 20px; }
        .gallery-item { aspect-ratio: 1/1; border-radius: 8px; overflow: hidden; background: #02050f; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); transition: transform 0.2s; }
        .gallery-item:hover { transform: scale(1.03); border-color: var(--amber); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }

        .delete-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-weight: bold; padding: 4px 8px; }
        @keyframes pulse-dot { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.6; } }
    </style>

            "Vecka 3: Ta en bild med en bira och en VM match i bakgrunden!",
            "Vecka 4: Fånga stämningen tillsammans med en vän eller familjemedlem! 🙌",
            "Vecka 5: Ta en bild med appens 1958-filter och återskapa en historisk fotbollsbild! 🏆"
        ];

        function getChallengeForCurrentWeek() {
            const startDate = new Date("2026-06-08");
            const today = new Date();
            const timeDiff = today - startDate;
            
            // Räkna ut hur många veckor som passerat (0 = vecka 1, 1 = vecka 2 osv)
            let weekIndex = Math.floor(timeDiff / (1000 * 60 * 60 * 24 * 7));
            
            // Säkerställ att vi håller oss mellan vecka 1 och 5 (index 0 - 4). Fallbackar till vecka 1 om vi är innan startdatum.
            if (weekIndex < 0) weekIndex = 0;
            if (weekIndex > 4) weekIndex = 4; 
            
            // Uppdatera widgetens titel med aktuell vecka
            document.getElementById('challenge-title-text').innerText = `Veckans Utmaning (v.${weekIndex + 1})`;
            
            return weeklyChallenges[weekIndex];
        }

        const currentChallengeText = getChallengeForCurrentWeek();
        document.getElementById('current-challenge-text').innerText = currentChallengeText;

        function getAvatarGradient(name) {
            const colors = [['#3b82f6', '#1d4ed8'], ['#10b981', '#047857'], ['#f59e0b', '#b45309'], ['#ec4899', '#be185d']];
            let hash = 0;
            for (let i = 0; i < name.length; i++) { hash = name.charCodeAt(i) + ((hash << 5) - hash); }
            const index = Math.abs(hash % colors.length);
            return `linear-gradient(135deg, ${colors[index][0]} 0%, ${colors[index][1]} 100%)`;
        }

        function cleanUsername(rawName) {
            let name = rawName || "Tippare";
            if(name.includes('@')) name = name.split('@')[0];
            return name;
        }

        function getUserDisplayName(userId, fallbackName) {
            if (allCachedProfiles[userId] && allCachedProfiles[userId].username) return allCachedProfiles[userId].username;
            if (allCachedProfiles[userId] && allCachedProfiles[userId].displayName) return allCachedProfiles[userId].displayName;
            return fallbackName || "Tippare";
        }

        function renderAvatarHtml(userId, username, customSizeStyle = "") {
            const cleanedName = cleanUsername(username);
            const profileData = allCachedProfiles[userId];
            const savedAvatar = profileData ? profileData.avatar : null;
            
            if (savedAvatar) {
                return `<div class="user-avatar" style="${customSizeStyle}"><img src="${savedAvatar}" alt=""></div>`;
            } else {
                const gradient = getAvatarGradient(cleanedName);
                return `<div class="user-avatar" style="background:${gradient}; ${customSizeStyle}">${cleanedName.substring(0,2)}</div>`;
            }
        }

        function formatRelativeTime(isoString) {
            if (!isoString) return "Just nu";
            const now = new Date();
            const past = new Date(isoString);
            const diffMs = now - past;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);
            if (diffMins < 1) return "Just nu";
            if (diffMins < 60) return `${diffMins} min sedan`;
            if (diffHours < 24) return `${diffHours} tim sedan`;
            if (diffDays === 1) return `Igår`;
            return `${diffDays} dagar sedan`;
        }
    
        window.saveToCameraRoll = function(base64Data, filename) {
            const link = document.createElement('a');
            link.href = base64Data;
            link.download = filename || 'vm-bild-2026.jpg';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
    
        window.reactToPost = async function(postId, emojiType, hasReacted) {
            if (!currentUser) { alert("Du måste vara inloggad för att reagera."); return; }
            try {
                const postRef = doc(db, "photos", postId);
                if (hasReacted) {
                    await updateDoc(postRef, { [`reactedUsers.${emojiType}`]: arrayRemove(currentUser.uid) });
                } else {
                    await updateDoc(postRef, { [`reactedUsers.${emojiType}`]: arrayUnion(currentUser.uid) });
                }
                loadPhotoFeed();
            } catch (error) { console.error(error); }
        };
    
        window.addComment = async function(postId) {
            if (!currentUser) return;
            const inputField = document.getElementById(`comment-input-${postId}`);
            const commentText = inputField.value.trim();
            if (!commentText) return;
    
            try {
                const postRef = doc(db, "photos", postId);
                const myFallback = currentUser.displayName || currentUser.email;
                await updateDoc(postRef, {
                    comments: arrayUnion({
                        userId: currentUser.uid,
                        username: getUserDisplayName(currentUser.uid, myFallback),
                        text: commentText,
                        createdAt: new Date().toISOString()
                    })
                });
                inputField.value = "";
                loadPhotoFeed();
            } catch (error) { console.error(error); }
        };
    
        window.deletePost = async function(postId) {
            if (!confirm("Radera permanent?")) return;
            try {
                await deleteDoc(doc(db, "photos", postId));
                loadPhotoFeed();
            } catch (error) { console.error(error); }
        };

        window.toggleBioEdit = function() {
            const displayEl = document.getElementById('bio-display-text');
            const inputEl = document.getElementById('bio-edit-input-field');
            const btnEl = document.getElementById('bio-edit-btn');
            if (inputEl.style.display === 'none' || !inputEl.style.display) {
                inputEl.style.display = 'block';
                inputEl.focus();
                btnEl.innerText = 'Spara beskrivning';
            } else {
                saveBio(inputEl.value.trim());
            }
        };

        async function saveBio(newBio) {
            if(!currentUser) return;
            try {
                const profileRef = doc(db, "profiles", currentUser.uid);
                const existing = allCachedProfiles[currentUser.uid] || {};
                await setDoc(profileRef, {
                    ...existing,
                    bio: newBio,
                    username: existing.username || cleanUsername(currentUser.displayName || currentUser.email)
                }, { merge: true });
                loadPhotoFeed().then(() => { window.openUserProfile(currentUser.uid, currentUser.displayName || currentUser.email); });
            } catch (e) { console.error(e); }
        }

        window.triggerAvatarUpload = function() {
            document.getElementById('avatar-upload-input').click();
        };

        window.openUserProfile = function(targetUserId, targetUsername) {
            const modal = document.getElementById('profileModal');
            const headerBlock = document.getElementById('modalProfileHeader');
            const gallery = document.getElementById('profileGallery');
            const userPhotos = allCachedPhotos.filter(p => p.userId === targetUserId);
            const absoluteUsername = getUserDisplayName(targetUserId, targetUsername);
            
            let totalReactionsMade = 0;
            allCachedPhotos.forEach(photo => {
                if(photo.reactedUsers) {
                    if (photo.reactedUsers.heart?.includes(targetUserId)) totalReactionsMade++;
                    if (photo.reactedUsers.fire?.includes(targetUserId)) totalReactionsMade++;
                    if (photo.reactedUsers.football?.includes(targetUserId)) totalReactionsMade++;
                }
            });

            const profileDoc = allCachedProfiles[targetUserId] || {};
            const userBio = profileDoc.bio || "Ingen beskrivning tillagd ännu.";
            const isMe = currentUser && currentUser.uid === targetUserId;

            const avatarMainHtml = renderAvatarHtml(targetUserId, absoluteUsername, "width:80px; height:80px; font-size:1.6rem;");
            const avatarWithUploadWrapper = isMe 
                ? `<div class="modal-avatar-wrapper" onclick="triggerAvatarUpload()">${avatarMainHtml}<div class="avatar-edit-overlay">📸</div></div>`
                : `<div class="modal-avatar">${avatarMainHtml}</div>`;

            headerBlock.innerHTML = `
                ${avatarWithUploadWrapper}
                <h2 style="font-size:1.3rem; margin-top:5px; font-weight:800;">${cleanUsername(absoluteUsername)}</h2>
                <div class="profile-stats-grid">
                    <div class="stat-box">
                        <div class="stat-value">${userPhotos.length}</div>
                        <div class="stat-label">Bilder</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value">${totalReactionsMade}</div>
                        <div class="stat-label">Reaktioner</div>
                    </div>
                </div>
                <div class="profile-bio-container">
                    <div class="bio-text" id="bio-display-text">${userBio}</div>
                    ${isMe ? `
                        <input type="text" id="bio-edit-input-field" class="bio-edit-input" maxlength="120" value="${userBio === 'Ingen beskrivning tillagd ännu.' ? '' : userBio}">
                        <button class="btn-edit-bio" id="bio-edit-btn" onclick="toggleBioEdit()">Ändra beskrivning</button>
                    ` : ''}
                </div>
            `;

            let galleryHtml = "";
            userPhotos.forEach(p => {
                galleryHtml += `
                    <div class="gallery-item" onclick="document.getElementById('profileModal').style.display='none'; document.getElementById('${p.id}').scrollIntoView({behavior: 'smooth'});">
                        <img src="${p.image}">
                    </div>
                `;
            });
            gallery.innerHTML = galleryHtml || '<div style="grid-column: span 3; color:var(--text-muted); font-size:0.85rem; padding:30px; text-align:center;">Inga bilder uppladdade än.</div>';
            modal.style.display = "flex";
        };

        document.getElementById('avatar-upload-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file || !currentUser) return;
            const reader = new FileReader();
            reader.onload = async function(event) {
                const img = new Image();
                img.onload = async function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 150; canvas.height = 150;
                    const min = Math.min(img.width, img.height);
                    ctx.drawImage(img, (img.width-min)/2, (img.height-min)/2, min, min, 0, 0, 150, 150);
                    
                    const avatarBase64 = canvas.toDataURL('image/jpeg', 0.85);
                    try {
                        const profileRef = doc(db, "profiles", currentUser.uid);
                        const existing = allCachedProfiles[currentUser.uid] || {};
                        await setDoc(profileRef, {
                            ...existing,
                            avatar: avatarBase64,
                            username: existing.username || cleanUsername(currentUser.displayName || currentUser.email)
                        }, { merge: true });
                        
                        loadPhotoFeed().then(() => {
                            window.openUserProfile(currentUser.uid, currentUser.displayName || currentUser.email);
                        });
                    } catch (err) { console.error("Kunde inte spara profilbild:", err); }
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        window.applyFilterStyle = function(filterType) {
            if (!originalLoadedImage) return;
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(b => b.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');

            const canvas = document.getElementById('filter-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 800; canvas.height = 800;
            const min = Math.min(originalLoadedImage.width, originalLoadedImage.height);
            ctx.drawImage(originalLoadedImage, (originalLoadedImage.width-min)/2, (originalLoadedImage.height-min)/2, min, min, 0, 0, 800, 800);
            
            if (filterType === 'retro') {
                ctx.fillStyle = 'rgba(230, 150, 40, 0.15)'; ctx.globalCompositeOperation = 'multiply'; ctx.fillRect(0, 0, 800, 800); ctx.globalCompositeOperation = 'source-over';
            } else if (filterType === 'gold') {
                ctx.fillStyle = 'rgba(251, 191, 36, 0.1)'; ctx.globalCompositeOperation = 'color-burn'; ctx.fillRect(0, 0, 800, 800); ctx.globalCompositeOperation = 'source-over';
            } else if (filterType === 'vm1958') {
                const imgData = ctx.getImageData(0, 0, 800, 800); const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const brightness = 0.34 * data[i] + 0.5 * data[i + 1] + 0.16 * data[i + 2];
                    data[i] = brightness; data[i + 1] = brightness; data[i + 2] = brightness;
                }
                ctx.putImageData(imgData, 0, 0);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.03)'; ctx.globalCompositeOperation = 'overlay'; ctx.fillRect(0, 0, 800, 800); ctx.globalCompositeOperation = 'source-over';
            }
            selectedBase64Image = canvas.toDataURL('image/jpeg', 0.80);
        };

        function renderUsersCarousel() {
            const carouselSection = document.getElementById('users-carousel-section');
            const carouselList = document.getElementById('users-carousel-list');
            const uniqueUsers = new Map();
            for (const [uid, prof] of Object.entries(allCachedProfiles)) {
                if (prof.username || prof.displayName) uniqueUsers.set(uid, prof.username || prof.displayName);
            }
            allCachedPhotos.forEach(p => { if(p.userId) uniqueUsers.set(p.userId, getUserDisplayName(p.userId, p.username)); });
            if (uniqueUsers.size === 0) { carouselSection.style.display = "none"; return; }

            let html = "";
            uniqueUsers.forEach((username, uid) => {
                const finalDisplayName = getUserDisplayName(uid, username);
                html += `
                    <div class="user-carousel-item" onclick="openUserProfile('${uid}', '${finalDisplayName}')">
                        <div class="avatar-ring">${renderAvatarHtml(uid, finalDisplayName, "width:52px; height:52px; font-size:1.1rem; border:2px solid var(--bg-main);")}</div>
                        <div class="user-carousel-name">${cleanUsername(finalDisplayName)}</div>
                    </div>
                `;
            });
            carouselList.innerHTML = html; carouselSection.style.display = "block";
        }

        function renderHeaderMyProfile() {
            const block = document.getElementById('my-profile-header-block');
            if (!currentUser) { block.innerHTML = ""; return; }
            const myName = getUserDisplayName(currentUser.uid, currentUser.displayName || currentUser.email);
            block.innerHTML = `
                <div class="header-profile" onclick="openUserProfile('${currentUser.uid}', '${myName}')">
                    ${renderAvatarHtml(currentUser.uid, myName, "width:28px; height:28px; font-size:0.75rem;")}
                    <span class="header-profile-name">${cleanUsername(myName)}</span>
                </div>
            `;
        }

        document.getElementById('closeModalBtn').addEventListener('click', () => { document.getElementById('profileModal').style.display = 'none'; });
    
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            document.getElementById('upload-section').style.display = user ? 'block' : 'none';
            document.getElementById('auth-alert').style.display = user ? 'none' : 'block';
            loadPhotoFeed();
        });
    
        document.getElementById('image-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    originalLoadedImage = img; 
                    document.getElementById('preview-container').style.display = 'block';
                    document.getElementById('filter-controls').style.display = 'flex';
                    applyFilterStyle('normal');
                    document.getElementById('file-label-text').innerText = "✓ Bild vald!";

                    if (navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition(async (position) => {
                            try {
                                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${position.coords.latitude}&lon=${position.coords.longitude}`);
                                const geoData = await res.json();
                                const city = geoData.address.city || geoData.address.town || geoData.address.village || "";
                                if(city) document.getElementById('image-location').value = city;
                            } catch (err) {}
                        });
                    }
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
    
        document.getElementById('upload-btn').addEventListener('click', async () => {
            if (!currentUser || !selectedBase64Image) return;
            try {
                const isChallenge = document.getElementById('participate-challenge').checked;
                await addDoc(collection(db, "photos"), {
                    userId: currentUser.uid, 
                    username: getUserDisplayName(currentUser.uid, currentUser.displayName || currentUser.email),
                    image: selectedBase64Image,
                    caption: document.getElementById('image-caption').value.trim(),
                    location: document.getElementById('image-location').value.trim(),
                    isChallengePost: isChallenge, 
                    createdAt: new Date().toISOString(),
                    reactedUsers: { heart: [], fire: [], football: [] },
                    comments: [] 
                });
                document.getElementById('image-caption').value = "";
                document.getElementById('image-location').value = "";
                document.getElementById('participate-challenge').checked = false;
                selectedBase64Image = null; originalLoadedImage = null;
                document.getElementById('preview-container').style.display = 'none';
                document.getElementById('filter-controls').style.display = 'none';
                document.getElementById('file-label-text').innerText = "🖼️ Välj eller ta en bild";
                loadPhotoFeed();
            } catch (error) { alert(error.message); }
        });
    
        async function loadPhotoFeed() {
            const feedContainer = document.getElementById('feed-container');
            try {
                const profilesSnapshot = await getDocs(collection(db, "profiles"));
                allCachedProfiles = {};
                profilesSnapshot.forEach(d => { allCachedProfiles[d.id] = d.data(); });

                const querySnapshot = await getDocs(query(collection(db, "photos"), orderBy("createdAt", "desc")));
                allCachedPhotos = [];
                querySnapshot.forEach(d => { allCachedPhotos.push({ id: d.id, ...d.data() }); });

                renderHeaderMyProfile();
                renderUsersCarousel();
                
                if (querySnapshot.empty) { feedContainer.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding-top:20px;">Inga inlägg än.</div>'; return; }
                
                let html = "";
                const uid = currentUser ? currentUser.uid : null;
    
                allCachedPhotos.forEach((data) => {
                    const postId = data.id;
                    const hearts = data.reactedUsers?.heart || [];
                    const fires = data.reactedUsers?.fire || [];
                    const footballs = data.reactedUsers?.football || [];
                    const hasHeart = uid ? hearts.includes(uid) : false;
                    const hasFire = uid ? fires.includes(uid) : false;
                    const hasFootball = uid ? footballs.includes(uid) : false;
                    const isMyPost = data.userId === uid;
                    const postUserDynamicName = getUserDisplayName(data.userId, data.username);
                    const postTimeText = formatRelativeTime(data.createdAt);
                    const locationText = data.location ? `<span class="post-location">📍 ${data.location}</span>` : "";

                    const isChallengeStyleClass = data.isChallengePost ? "challenge-entry" : "";
                    // Ändrad text till Veckans Utmaning på badgen
                    const challengeBadgeHtml = data.isChallengePost ? `<span class="challenge-badge">🏆 Veckans Utmaning</span>` : "";

                    let commentsHtml = "";
                    (data.comments || []).forEach(c => {
                        const commentUserDynamicName = getUserDisplayName(c.userId, c.username);
                        commentsHtml += `
                            <div class="comment-item">
                                <div class="comment-header-row">
                                    <span class="comment-user" onclick="openUserProfile('${c.userId || ''}', '${commentUserDynamicName}')">${cleanUsername(commentUserDynamicName)}</span>
                                    <span class="comment-time">${formatRelativeTime(c.createdAt)}</span>
                                </div>
                                <span class="comment-text">${c.text}</span>
                            </div>
                        `;
                    });

                    html += `
                        <div class="post-card ${isChallengeStyleClass}" id="${postId}">
                            <div class="post-header">
                                <div class="post-header-left">
                                    <div class="post-user-info" onclick="openUserProfile('${data.userId || ''}', '${postUserDynamicName}')">
                                        ${renderAvatarHtml(data.userId || '', postUserDynamicName)}
                                        <span class="post-user">${cleanUsername(postUserDynamicName)}</span>
                                    </div>
                                    <div class="post-meta-details">
                                        <span>• ${postTimeText}</span>
                                        ${locationText}
                                    </div>
                                </div>
                                ${challengeBadgeHtml}
                                ${isMyPost ? `<button class="delete-btn" onclick="deletePost('${postId}')">✕</button>` : ''}
                            </div>
                            
                            <div class="post-img-container">
                                <img class="post-img" src="${data.image}">
                            </div>
                            
                            <div class="post-actions-bar">
                                <div class="actions-left">
                                    <button class="action-icon-btn ${hasHeart ? 'active' : ''}" onclick="reactToPost('${postId}', 'heart', ${hasHeart})">❤️ <span>${hearts.length}</span></button>
                                    <button class="action-icon-btn ${hasFire ? 'active' : ''}" onclick="reactToPost('${postId}', 'fire', ${hasFire})">🔥 <span>${fires.length}</span></button>
                                    <button class="action-icon-btn ${hasFootball ? 'active' : ''}" onclick="reactToPost('${postId}', 'football', ${hasFootball})">⚽ <span>${footballs.length}</span></button>
                                </div>
                                <button class="btn-save-insta" onclick="saveToCameraRoll('${data.image}', 'vm2026.jpg')">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                                </button>
                            </div>
                            
                            <div class="post-footer">
                                ${data.caption ? `<div class="post-caption"><strong>${cleanUsername(postUserDynamicName)}</strong>${data.caption}</div>` : ''}
                                <div class="comments-section">
                                    <div class="comments-list">${commentsHtml}</div>
                                    ${currentUser ? `
                                        <div class="comment-input-container">
                                            <input type="text" class="comment-input" id="comment-input-${postId}" placeholder="Lägg till en kommentar..." onkeydown="if(event.key === 'Enter') addComment('${postId}')">
                                            <button class="btn-comment-submit" onclick="addComment('${postId}')">Publicera</button>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        </div>`;
                });
                feedContainer.innerHTML = html;
            } catch (error) { console.error(error); }
        }
    </script>
</body>
</html>
